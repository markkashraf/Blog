<div class="container">
    <h1 class="mt-3">Edit Category</h1>
    
    <form action="" [formGroup] = "editCategoryFormGroup" (ngSubmit) = "onSubmit()">
        <div class="mt-3">
            <div class="">
                <label class="form-label" >Name</label>
                <input type="text" class="form-control" formControlName="categoryName">
            </div>

            <div class="mt-3">
                <label class="form-label" >URL Handle (slug)</label>
                <input type="text" class="form-control" formControlName="urlHandle">
            </div>

            <div class="mt-3" type="submit">
                <button class="btn btn-primary">Save</button>
            </div>
        </div>
    </form>
</div>
