
<div class="container">
    <h1 class="mt-3">Category List</h1>

    @if (isLoading()==true) {
        <h2>loading....</h2>
    }

        <table class="table table-bordered">
            <th>ID</th>
            <th>Name</th>
            <th>URL Handle</th>
            <th> </th>

            @for (item of catList(); track $index) {
                <tr>
                <td>{{item.id}}</td>
                <td>{{item.name}}</td>    
                <td>{{item.urlHandle}}</td>
                <td>
                    <a class="btn btn-light" [routerLink]="['/admin','categories','edit', item.id]">Edit</a>
                </td>
                </tr>
            }
        </table>


    <button class="btn btn-primary mt-3" [routerLink]="['/admin', 'categories', 'add']">Add Category</button>
</div>
